<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trilha do Consultor JG</title>
  <meta name="description" content="Trilha formativa de onboarding para consultores comerciais da Jovens Gênios.">
  <meta name="theme-color" content="#0F1A4A">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='%233CC3B5'/%3E%3Cellipse cx='32' cy='32' rx='30' ry='8' fill='none' stroke='%23F5C84C' stroke-width='4' transform='rotate(-16 32 32)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <div class="stars" aria-hidden="true"></div>

  <header class="topbar">
    <div class="top-left">
      <button id="avatarBtn" class="avatar-btn" type="button" data-action="avatar" aria-label="Trocar avatar"></button>
      <div id="league" class="league"></div>
    </div>
    <div class="top-right">
      <span id="tierPill" class="pill pill-tier"></span>
      <span id="pointsPill" class="pill pill-points"></span>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <p class="loading">Carregando a trilha…</p>
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a href="#/inicio" data-nav="inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></svg>
      <span>INÍCIO</span>
    </a>
    <a href="#/trilha" data-nav="trilha">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
      <span>MINHA TRILHA</span>
    </a>
    <a href="#/biblioteca" data-nav="biblioteca">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>BIBLIOTECA</span>
    </a>
    <a href="#/como-funciona" data-nav="como-funciona">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      <span>COMO FUNCIONA</span>
    </a>
  </nav>

  <button id="a11yBtn" class="a11y-btn" type="button" data-action="font" aria-label="Aumentar o tamanho da fonte (atual: 100%)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.5" r="2"/><path d="M5 8.5l7 1.5 7-1.5"/><path d="M12 10v5l-3 6"/><path d="M12 15l3 6"/></svg>
  </button>

  <div id="modalRoot"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
